name: Validate channels JSON

on:
  push:
    branches:
      - main
    paths:
      - channels.json
      - .github/workflows/validate-channels-json.yml
  pull_request:
    paths:
      - channels.json
      - .github/workflows/validate-channels-json.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate channels.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse channels.json
        run: node -e "JSON.parse(require('fs').readFileSync('channels.json', 'utf8'))"
